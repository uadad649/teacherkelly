name: 영어 시트 만들기

# Actions 탭 → 왼쪽에서 이 워크플로 고르기 → 오른쪽 'Run workflow' 버튼
# → 유튜브 주소 붙여넣고 실행.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "유튜브 주소 (예: https://www.youtube.com/watch?v=xxxxxxxxxxx)"
        required: true
        type: string

  # 매일 새벽 자동. 주소를 주지 않으므로 main.py 가 channels.txt 의
  # 채널에서 아직 안 본 최신 영상을 골라 온다.
  # cron 은 UTC 다. 21:23 UTC = 한국 새벽 6시 23분.
  # 정각(:00)은 실행이 몰려 밀리므로 어중간한 분을 쓴다.
  schedule:
    - cron: "23 21 * * *"

# 같은 저장소에 두 번 겹쳐 돌면 커밋이 서로를 덮어쓴다. 한 번에 하나만.
concurrency:
  group: sheet
  cancel-in-progress: false

jobs:
  make-sheet:
    # 깃허브가 빌려주는 우분투 서버가 아니라 '내 PC' 에서 돈다.
    #
    # 유튜브는 데이터센터(AWS·GitHub 등)에서 오는 자막 요청을 막는다.
    # 우분투 러너로는 RequestBlocked 가 나서 한 발짝도 못 간다.
    # 집 인터넷 IP 는 막히지 않으므로 내 PC 를 러너로 쓴다.
    #
    # PC 가 꺼져 있으면 작업이 큐에서 기다린다. 24시간 안에 켜면 그때 돈다.
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    permissions:
      contents: write        # words.json / 결과 폴더를 저장소에 되돌려 쓰기 위해

    steps:
      - uses: actions/checkout@v7

      # 파이썬과 Claude Code 는 이 PC 에 이미 깔려 있으므로 설치하지 않는다.
      # (우분투 러너였다면 매번 내려받아야 했다)
      - name: 라이브러리 확인
        run: python -m pip install --quiet -r requirements.txt

      - name: 시트 만들고 메일 보내기
        env:
          # 수동 실행이면 주소가 들어오고, 스케줄 실행이면 빈 값이 된다.
          # 빈 값일 때 main.py 가 channels.txt 에서 고른다.
          VIDEO_URL: ${{ inputs.url }}
          # 자동으로 고를 때만 쇼츠(너무 짧음)와 라이브·설명회(너무 김)를 거른다.
          # 사람이 직접 고른 영상은 길이와 상관없이 그대로 만든다.
          MIN_TRANSCRIPT_LINES: ${{ github.event_name == 'schedule' && '30' || '0' }}
          MAX_TRANSCRIPT_LINES: ${{ github.event_name == 'schedule' && '1500' || '0' }}
          # 'claude setup-token' 으로 만든 1년짜리 구독 토큰
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API 키를 따로 쓸 사람만. 있으면 이쪽이 먼저 쓰인다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 유튜브가 GitHub 서버 IP 를 막을 때만 쓴다. 없으면 그냥 비워 둔다.
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: 결과를 저장소에 남기기
        # 메일 보내기가 실패해도 만든 시트는 남겨야 한다.
        if: always()
        # 윈도우 러너의 기본 셸은 PowerShell 이다.
        # Git 과 함께 깔린 bash 를 써서 아래 스크립트를 그대로 쓴다.
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          # .gitignore 가 중간 파일을 걸러 주므로, 남는 것은 words.json 과 결과/ 뿐이다.
          # 실행이 중간에 멈춰 그 둘이 아직 없어도 여기서 에러가 나지 않는다.
          git add -A
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git commit -m "시트 추가: $(date +%Y-%m-%d)"
          # 그 사이 다른 실행이 밀어 넣었을 수 있으니 한 번 당겨 붙인다.
          git pull --rebase --autostash
          git push
